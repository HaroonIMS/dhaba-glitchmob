server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location = /health {
    default_type text/plain;
    return 200 'ok';
  }

  # Version shown by this service, written at build time.
  location = /info {
    alias /usr/share/nginx/html/version.json;
    default_type application/json;
  }

  location / {
    try_files $uri /index.html;
  }
}
