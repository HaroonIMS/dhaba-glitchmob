apiVersion: batch/v1
kind: CronJob
metadata:
  name: ops-monitor
  namespace: ops
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3

  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          serviceAccountName: ops-monitor
          restartPolicy: Never

          containers:
            - name: ops-monitor
              image: 374211129794.dkr.ecr.ap-southeast-2.amazonaws.com/dhaba-glitchmob/ops-monitor:REPLACE_WITH_COMMIT_TAG
              imagePullPolicy: IfNotPresent

              command:
                - /opt/monitor/ops-monitor.sh

              env:
                - name: SLACK_WEBHOOK_URL
                  valueFrom:
                    secretKeyRef:
                      name: slack-webhook
                      key: url
