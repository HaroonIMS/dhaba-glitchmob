spring.main.web-application-type=none
spring.main.banner-mode=off

spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=6379

spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:postgres}:5432/${POSTGRES_DB:dhaba}
spring.datasource.username=${POSTGRES_USER:dhaba}
spring.datasource.password=${POSTGRES_PASSWORD:}
# Start even when Postgres is down; the worker retries jobs until it is back.
spring.datasource.hikari.initialization-fail-timeout=-1

worker.cook-millis=5000
worker.heartbeat-file=/tmp/heartbeat
