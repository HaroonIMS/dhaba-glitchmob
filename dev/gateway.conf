# Mimics the Kubernetes Ingress for local testing.
server {
  listen 80;
  location /api/menu   { proxy_pass http://menu-api:8000; }
  location /api/orders { proxy_pass http://orders-api:8080; }
  location /api/stats  { proxy_pass http://stats-api:8080; }
  location /           { proxy_pass http://web:8080; }
}
